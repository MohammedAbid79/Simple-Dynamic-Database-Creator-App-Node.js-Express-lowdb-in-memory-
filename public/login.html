<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Dynamic DB Creator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      color: #e2e8f0;
      background: #0f1117;
      background-image:
        radial-gradient(ellipse 70% 50% at 70% 10%, rgba(99,102,241,.18) 0%, transparent 60%),
        radial-gradient(ellipse 45% 40% at 10% 90%, rgba(16,185,129,.1) 0%, transparent 55%);
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2a2d45;
      border-radius: 16px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 14px;
      font-size: 26px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #64748b;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #111827;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.2);
    }

    input::placeholder { color: #3d4263; }

    .btn-signin {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(99,102,241,.4);
    }

    .btn-signin:hover { background: #4f46e5; box-shadow: 0 6px 20px rgba(99,102,241,.45); }
    .btn-signin:active { transform: scale(.98); }
    .btn-signin:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* ── Error ── */
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
    }

    /* ── Hints ── */
    .hints {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #1e2235;
      display: flex;
      gap: 12px;
    }

    .hint {
      flex: 1;
      background: #111827;
      border: 1px solid #1e2235;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }

    .hint b { color: #64748b; display: block; margin-bottom: 2px; }
    .hint code { color: #818cf8; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="icon-wrap">&#128196;</div>
        <h1>Dynamic DB Creator</h1>
        <p>Node.js &middot; Express &middot; lowdb in-memory</p>
      </div>

      <form id="form" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Enter username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <button class="btn-signin" type="submit" id="btn">Sign In</button>
        <div class="error" id="err"></div>
      </form>

      <div class="hints">
        <div class="hint">
          <b>Admin</b>
          <code>admin / admin123</code>
        </div>
        <div class="hint">
          <b>Guest</b>
          <code>guest / guest123</code>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
