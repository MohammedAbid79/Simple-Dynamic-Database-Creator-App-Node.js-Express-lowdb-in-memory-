<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Dynamic DB Creator</title>
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 200 800;
      src: url('/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg-base:            #080612;
      --bg-g1:              rgba(109, 40, 217, 0.55);
      --bg-g2:              rgba(29,  78, 216, 0.45);
      --bg-g3:              rgba(16, 185, 129, 0.12);

      --card-bg:            rgba(255, 255, 255, 0.04);
      --card-border:        rgba(255, 255, 255, 0.09);
      --card-shadow:        0 40px 80px rgba(0,0,0,0.55), 0 8px 32px rgba(109,40,217,0.18);

      --tab-bg:             rgba(0, 0, 0, 0.35);
      --tab-border:         rgba(255, 255, 255, 0.07);
      --tab-txt:            rgba(255, 255, 255, 0.38);
      --tab-active-txt:     rgba(255, 255, 255, 0.95);

      --label-txt:          rgba(255, 255, 255, 0.55);
      --input-bg:           rgba(255, 255, 255, 0.06);
      --input-border:       rgba(255, 255, 255, 0.11);
      --input-txt:          rgba(255, 255, 255, 0.92);
      --input-ph:           rgba(255, 255, 255, 0.22);
      --input-focus-border: rgba(167, 139, 250, 0.65);
      --input-focus-bg:     rgba(255, 255, 255, 0.09);
      --input-focus-ring:   0 0 0 3px rgba(124, 58, 237, 0.2);

      --hint-txt:           rgba(255, 255, 255, 0.3);
      --sep-color:          rgba(255, 255, 255, 0.08);
      --tagline-txt:        rgba(255, 255, 255, 0.35);
      --wordmark-grad:      linear-gradient(120deg, #c4b5fd 0%, #818cf8 50%, #67e8f9 100%);

      --btn-bg:             linear-gradient(135deg, #7c3aed, #4338ca);
      --btn-shadow:         0 4px 20px rgba(109,40,217,0.45);
      --btn-shadow-h:       0 6px 28px rgba(109,40,217,0.6);

      --msg-err-bg:         rgba(239,68,68,0.12);
      --msg-err-border:     rgba(239,68,68,0.28);
      --msg-err-txt:        #fca5a5;
      --msg-ok-bg:          rgba(16,185,129,0.12);
      --msg-ok-border:      rgba(16,185,129,0.28);
      --msg-ok-txt:         #6ee7b7;

      --sw-track:           rgba(255,255,255,0.13);
      --sw-track-on:        rgba(139,92,246,0.45);
      --sw-thumb:           #fff;
      --sw-icon:            rgba(255,255,255,0.4);
    }

    [data-theme="light"] {
      --bg-base:            #ede9fe;
      --bg-g1:              rgba(139, 92, 246, 0.3);
      --bg-g2:              rgba(99, 102, 241, 0.22);
      --bg-g3:              rgba(16, 185, 129, 0.07);

      --card-bg:            rgba(255, 255, 255, 0.82);
      --card-border:        rgba(139, 92, 246, 0.18);
      --card-shadow:        0 20px 60px rgba(109,40,217,0.14), 0 4px 20px rgba(0,0,0,0.1);

      --tab-bg:             rgba(0, 0, 0, 0.05);
      --tab-border:         rgba(0, 0, 0, 0.08);
      --tab-txt:            rgba(0, 0, 0, 0.38);
      --tab-active-txt:     #fff;

      --label-txt:          rgba(0, 0, 0, 0.6);
      --input-bg:           rgba(255, 255, 255, 0.9);
      --input-border:       rgba(0, 0, 0, 0.14);
      --input-txt:          rgba(0, 0, 0, 0.88);
      --input-ph:           rgba(0, 0, 0, 0.28);
      --input-focus-border: rgba(124, 58, 237, 0.6);
      --input-focus-bg:     #fff;
      --input-focus-ring:   0 0 0 3px rgba(124,58,237,0.12);

      --hint-txt:           rgba(0, 0, 0, 0.38);
      --sep-color:          rgba(0, 0, 0, 0.09);
      --tagline-txt:        rgba(0, 0, 0, 0.42);
      --wordmark-grad:      linear-gradient(120deg, #6d28d9 0%, #4f46e5 55%, #0891b2 100%);

      --btn-bg:             linear-gradient(135deg, #7c3aed, #4338ca);
      --btn-shadow:         0 4px 20px rgba(109,40,217,0.35);
      --btn-shadow-h:       0 6px 28px rgba(109,40,217,0.5);

      --msg-err-bg:         rgba(239,68,68,0.08);
      --msg-err-border:     rgba(239,68,68,0.25);
      --msg-err-txt:        #dc2626;
      --msg-ok-bg:          rgba(16,185,129,0.08);
      --msg-ok-border:      rgba(16,185,129,0.25);
      --msg-ok-txt:         #059669;

      --sw-track:           rgba(0,0,0,0.12);
      --sw-track-on:        rgba(109,40,217,0.28);
      --sw-thumb:           #7c3aed;
      --sw-icon:            rgba(0,0,0,0.38);
    }

    /* ── Base ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%,   var(--bg-g1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%,  var(--bg-g2) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 60% 50%,   var(--bg-g3) 0%, transparent 50%),
        var(--bg-base);
      transition: background 0.35s;
    }

    /* ── Wrap ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 40px 36px 36px;
      box-shadow: var(--card-shadow);
      transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sw-icon {
      width: 13px;
      height: 13px;
      color: var(--sw-icon);
      flex-shrink: 0;
      transition: color 0.25s;
    }

    .theme-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .theme-switch input { position: absolute; opacity: 0; width: 0; height: 0; }

    .sw-track {
      width: 32px;
      height: 18px;
      background: var(--sw-track);
      border-radius: 99px;
      position: relative;
      transition: background 0.25s;
    }

    .theme-switch input:checked + .sw-track { background: var(--sw-track-on); }

    .sw-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--sw-thumb);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), background 0.25s;
    }

    .theme-switch input:checked + .sw-track .sw-thumb { transform: translateX(14px); }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      box-shadow: 0 6px 22px rgba(109,40,217,0.45);
      margin-bottom: 15px;
    }

    .logo-ring svg { width: 26px; height: 26px; }

    .wordmark {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: var(--wordmark-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 12.5px;
      color: var(--tagline-txt);
      font-weight: 400;
      transition: color 0.35s;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 3px;
      background: var(--tab-bg);
      border: 1px solid var(--tab-border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 26px;
      transition: background 0.35s, border-color 0.35s;
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--tab-txt);
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(124,58,237,0.7) 0%, rgba(79,70,229,0.65) 100%);
      color: var(--tab-active-txt);
      box-shadow: 0 2px 10px rgba(124,58,237,0.3);
    }

    /* ── Form ── */
    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--label-txt);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
      transition: color 0.35s;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      color: var(--input-txt);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    input::placeholder { color: var(--input-ph); }

    input:focus {
      border-color: var(--input-focus-border);
      background: var(--input-focus-bg);
      box-shadow: var(--input-focus-ring);
    }

    .hint {
      font-size: 11.5px;
      color: var(--hint-txt);
      margin-top: 5px;
      transition: color 0.35s;
    }

    /* ── Password strength ── */
    .pw-bar-wrap {
      height: 3px;
      border-radius: 99px;
      margin-top: 7px;
      background: var(--sep-color);
      overflow: hidden;
    }

    .pw-bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0;
      transition: width 0.3s ease, background 0.3s;
    }

    /* ── Button ── */
    .btn {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      background: var(--btn-bg);
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: -0.02em;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: var(--btn-shadow);
    }

    .btn:hover  { opacity: .87; box-shadow: var(--btn-shadow-h); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── Messages ── */
    .msg {
      display: none;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 9px;
      font-size: 12.5px;
      line-height: 1.5;
      transition: background 0.35s, border-color 0.35s, color 0.35s;
    }

    .msg.error {
      background: var(--msg-err-bg);
      border: 1px solid var(--msg-err-border);
      color: var(--msg-err-txt);
    }

    .msg.success {
      background: var(--msg-ok-bg);
      border: 1px solid var(--msg-ok-border);
      color: var(--msg-ok-txt);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <!-- Theme toggle -->
      <div class="theme-toggle">
        <!-- Sun -->
        <svg class="sw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <label class="theme-switch" aria-label="Toggle light/dark theme">
          <input type="checkbox" id="theme-switch-input">
          <span class="sw-track"><span class="sw-thumb"></span></span>
        </label>
        <!-- Moon -->
        <svg class="sw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </div>

      <!-- Header -->
      <div class="header">
        <div class="logo-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
          </svg>
        </div>
        <div class="wordmark">Dynamic DB Creator</div>
        <div class="tagline">Manage your databases with ease</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" id="tab-signin"   onclick="switchTab('signin')">Sign In</button>
        <button class="tab"        id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Sign In panel -->
      <div class="panel active" id="panel-signin">
        <form id="signin-form" autocomplete="off">
          <div class="field">
            <label for="si-username">Username</label>
            <input id="si-username" type="text" placeholder="Enter your username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="si-password">Password</label>
            <input id="si-password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" id="si-btn">Sign In</button>
          <div class="msg error" id="si-err"></div>
        </form>
      </div>

      <!-- Create Account panel -->
      <div class="panel" id="panel-register">
        <form id="register-form" autocomplete="off">
          <div class="field">
            <label for="reg-username">Username</label>
            <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="off" />
            <div class="hint">Letters, numbers, and underscores</div>
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" />
            <div class="pw-bar-wrap"><div class="pw-bar-fill" id="pw-bar"></div></div>
            <div class="hint" id="pw-hint">At least 6 characters</div>
          </div>
          <div class="field">
            <label for="reg-confirm">Confirm Password</label>
            <input id="reg-confirm" type="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <button class="btn" type="submit" id="reg-btn">Create Account</button>
          <div class="msg error"   id="reg-err"></div>
          <div class="msg success" id="reg-ok"></div>
        </form>
      </div>

    </div>
  </div>

  <script>
    /* ── Theme ── */
    (function () {
      const THEME_KEY = 'fluxdb-theme';
      const sw   = document.getElementById('theme-switch-input');
      const root = document.documentElement;

      function apply(pref) {
        const isDark = pref === 'dark'
          || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = isDark ? 'dark' : 'light';
        if (sw) sw.checked = isDark; /* checked = dark (thumb right = moon side) */
      }

      apply(localStorage.getItem(THEME_KEY) || 'system');

      if (sw) {
        sw.addEventListener('change', function () {
          const pref = sw.checked ? 'dark' : 'light';
          localStorage.setItem(THEME_KEY, pref);
          apply(pref);
        });
      }
    })();

    /* ── Tab switching ── */
    function switchTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active',   tab === 'signin');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('panel-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
    }

    /* ── Password strength indicator ── */
    const pwInput = document.getElementById('reg-password');
    const pwBar   = document.getElementById('pw-bar');
    const pwHint  = document.getElementById('pw-hint');
    if (pwInput) {
      pwInput.addEventListener('input', function () {
        const v = pwInput.value;
        let s = 0;
        if (v.length >= 6)  s++;
        if (v.length >= 10) s++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
        if (/[\d\W]/.test(v)) s++;
        const pcts   = [0, 25, 50, 75, 100];
        const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        pwBar.style.width      = pcts[s] + '%';
        pwBar.style.background = colors[s] || '';
        pwHint.textContent     = s > 0 ? labels[s] : 'At least 6 characters';
      });
    }

    /* ── Sign in ── */
    document.getElementById('signin-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn  = document.getElementById('si-btn');
      const err  = document.getElementById('si-err');
      const user = document.getElementById('si-username').value.trim();
      const pass = document.getElementById('si-password').value;

      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');
        window.location.href = '/';
      } catch (ex) {
        err.textContent   = ex.message;
        err.style.display = 'block';
        btn.disabled      = false;
        btn.textContent   = 'Sign In';
      }
    });

    /* ── Register ── */
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn     = document.getElementById('reg-btn');
      const err     = document.getElementById('reg-err');
      const ok      = document.getElementById('reg-ok');
      const user    = document.getElementById('reg-username').value.trim();
      const pass    = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      err.style.display = 'none';
      ok.style.display  = 'none';

      if (!user)              { err.textContent = 'Username is required.';                   err.style.display = 'block'; return; }
      if (pass.length < 6)    { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
      if (pass !== confirm)   { err.textContent = 'Passwords do not match.';                 err.style.display = 'block'; return; }

      btn.disabled    = true;
      btn.textContent = 'Creating account…';

      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        ok.textContent  = 'Account created! Signing you in…';
        ok.style.display = 'block';
        setTimeout(() => { window.location.href = '/'; }, 900);
      } catch (ex) {
        err.textContent   = ex.message;
        err.style.display = 'block';
        btn.disabled      = false;
        btn.textContent   = 'Create Account';
      }
    });
  </script>
</body>
</html>
