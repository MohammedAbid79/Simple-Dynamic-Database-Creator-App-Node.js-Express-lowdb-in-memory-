<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Dynamic DB Creator</title>
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 200 800;
      src: url('/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2-variations');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%,   rgba(109, 40, 217, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%,  rgba(29,  78, 216, 0.45) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 60% 50%,   rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        #080612;
      overflow: hidden;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 16px;
    }

    /* ── Card ── */
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 36px 34px 32px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 40px 80px rgba(0, 0, 0, 0.6),
        0 8px 32px rgba(109, 40, 217, 0.15);
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .wordmark {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, #c4b5fd 0%, #818cf8 50%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 7px 0;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.38);
      cursor: pointer;
      transition: all .18s;
      font-family: inherit;
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.55), rgba(79, 70, 229, 0.45));
      color: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 8px rgba(124, 58, 237, 0.3);
    }

    /* ── Form ── */
    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 13px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 5px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 9px 13px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    input::placeholder { color: rgba(255, 255, 255, 0.2); }

    input:focus {
      border-color: rgba(167, 139, 250, 0.6);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: linear-gradient(135deg, #7c3aed, #4338ca);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 18px rgba(109, 40, 217, 0.45);
    }

    .btn:hover { opacity: .88; box-shadow: 0 6px 24px rgba(109, 40, 217, 0.55); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── Messages ── */
    .msg {
      display: none;
      margin-top: 11px;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .msg.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #fca5a5;
    }

    .msg.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="wordmark">Dynamic DB Creator</div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Sign In -->
      <div class="panel active" id="panel-signin">
        <form id="signin-form" autocomplete="off">
          <div class="field">
            <label for="si-username">Username</label>
            <input id="si-username" type="text" placeholder="Enter your username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="si-password">Password</label>
            <input id="si-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" id="si-btn">Sign In</button>
          <div class="msg error" id="si-err"></div>
        </form>
      </div>

      <!-- Create Account -->
      <div class="panel" id="panel-register">
        <form id="register-form" autocomplete="off">
          <div class="field">
            <label for="reg-username">Username</label>
            <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="off" />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" placeholder="Choose a password" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="reg-confirm">Confirm Password</label>
            <input id="reg-confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
          </div>
          <button class="btn" type="submit" id="reg-btn">Create Account</button>
          <div class="msg error" id="reg-err"></div>
          <div class="msg success" id="reg-ok"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('panel-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
    }

    document.getElementById('signin-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('si-btn');
      const err = document.getElementById('si-err');
      const username = document.getElementById('si-username').value.trim();
      const password = document.getElementById('si-password').value;

      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Invalid credentials');
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn    = document.getElementById('reg-btn');
      const err    = document.getElementById('reg-err');
      const ok     = document.getElementById('reg-ok');
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm  = document.getElementById('reg-confirm').value;

      err.style.display = 'none';
      ok.style.display  = 'none';

      if (!username) { err.textContent = 'Username is required.'; err.style.display = 'block'; return; }
      if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
      if (password !== confirm) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        ok.textContent = 'Account created! Signing you in…';
        ok.style.display = 'block';
        setTimeout(() => { window.location.href = '/'; }, 900);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
